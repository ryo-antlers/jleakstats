name: Sync Overseas Players (weekly)

# 海外でプレーする日本人選手を API-Football から発見し、
# canonical_id 紐付け済みのものを player_overseas_status に upsert する。
#
# - 週次 (毎週月曜 03:00 JST = 日曜 18:00 UTC) 実行
# - 手動でも workflow_dispatch から起動可
# - API-Football Pro plan の 7,500 req/day 枠から ~1,200 req 消費
# - 12 分前後で完走。timeout-minutes は 20 (余裕)
#
# 移籍は転送窓 (夏冬) に集中するので daily 不要、weekly で十分。

on:
  schedule:
    - cron: '0 18 * * 0'  # Sunday 18:00 UTC = Monday 03:00 JST
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run discover (apply)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          node scripts/discover_japanese_overseas.mjs --apply

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASS }}
          subject: '[J.Leak Stats] ⚠️ 海外組同期 失敗'
          to: ${{ secrets.GMAIL_USER }}
          from: J.Leak Stats Bot <${{ secrets.GMAIL_USER }}>
          body: |
            海外選手 sync GitHub Actions が失敗しました。
            ログ: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
